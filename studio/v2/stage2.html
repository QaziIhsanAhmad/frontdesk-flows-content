<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(node_modules/@fontsource/poppins/files/poppins-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:P;src:url(node_modules/@fontsource/poppins/files/poppins-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:P;src:url(node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:P;src:url(node_modules/@fontsource/poppins/files/poppins-latin-800-normal.woff2);font-weight:800}
:root{--bg:#0b1220;--card:#131c30;--line:#24304a;--or:#f5a623;--gr:#34d17f;--red:#f87171;--tx:#f4f6fb;--mut:#9aa6bf}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:P,sans-serif;color:var(--tx)}
#bgimg{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;filter:blur(18px) brightness(.35);transform:scale(1.15)}
.glow{position:absolute;inset:0;background:radial-gradient(900px 800px at 50% 45%,rgba(245,166,35,.10),transparent 70%)}
.layer{position:absolute;inset:0;display:none}
.prog{position:absolute;left:60px;right:60px;top:96px;height:6px;border-radius:3px;background:#1d2740;overflow:hidden;z-index:50}
.prog i{display:block;height:100%;background:var(--or);width:0}
.bug{position:absolute;left:60px;top:122px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:26px;color:#cbd5e1;z-index:50}
.bug b{width:40px;height:40px;border-radius:11px;background:var(--or);color:#111;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.real{position:absolute;right:60px;top:126px;font-weight:700;font-size:22px;letter-spacing:1px;color:var(--gr);border:2px solid var(--gr);border-radius:30px;padding:4px 14px;z-index:50}
.head{position:absolute;left:60px;right:60px;top:205px;text-align:center;font-weight:800;font-size:60px;line-height:1.1;letter-spacing:-.5px}
.head .or{color:var(--or)} .head .gr{color:var(--gr)}
.win{position:absolute;left:40px;right:40px;top:400px;height:980px;border-radius:30px;overflow:hidden;background:#2a2a2a;border:3px solid var(--line)}
.win img.src{position:absolute;left:0;top:0;transform-origin:0 0}
.win canvas{position:absolute;left:0;top:0}
.sub{position:absolute;left:70px;right:70px;top:1420px;text-align:center;font-weight:700;font-size:44px;line-height:1.22;text-shadow:0 3px 14px rgba(0,0,0,.6)}
.sub em{font-style:normal;color:var(--or)}
.chip{position:absolute;left:70px;top:418px;z-index:10;display:flex;align-items:center;gap:16px;background:rgba(11,18,32,.92);border:2px solid var(--line);border-radius:22px;padding:16px 22px;max-width:900px}
.chip .n{flex:none;width:52px;height:52px;border-radius:50%;background:var(--or);color:#111;font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center}
.chip .t{font-weight:700;font-size:34px;line-height:1.1}
.chip .s{font-weight:500;font-size:24px;color:var(--mut);margin-top:3px}
.sim{display:inline-block;margin-left:10px;vertical-align:middle;font-size:18px;font-weight:700;letter-spacing:1px;color:var(--or);border:2px solid var(--or);border-radius:20px;padding:1px 10px}
.simbar{position:absolute;left:40px;right:40px;top:1386px;text-align:center;font-size:21px;white-space:nowrap;font-weight:600;color:var(--or)}
/* hook */
.hk{position:absolute;left:40px;right:40px;top:190px;text-align:center;z-index:20}
.hk .l{font-weight:800;font-size:92px;line-height:1.02;letter-spacing:-2px;text-shadow:0 6px 30px rgba(0,0,0,.7)}
.hk .l.or{color:var(--or)} .hk .l.gr{color:var(--gr)}
.badge{display:inline-block;margin-top:44px;background:var(--gr);color:#06210f;font-weight:800;font-size:40px;padding:14px 30px;border-radius:50px}
.notif{position:absolute;left:90px;right:90px;top:1180px;z-index:20;background:rgba(30,41,59,.95);border-radius:30px;padding:24px 28px;display:flex;gap:20px;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.notif .ic{width:70px;height:70px;border-radius:18px;background:#0f766e;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:34px;flex:none}
.notif .a{font-size:24px;color:var(--mut);font-weight:600} .notif .b{font-size:30px;font-weight:600;line-height:1.25}
/* phone frame for form / mail */
.phone{position:absolute;left:190px;width:700px;top:400px;height:980px;border-radius:60px;border:12px solid #1e2a40;overflow:hidden;background:#fff;box-shadow:0 40px 120px rgba(0,0,0,.6)}
.phone img{position:absolute;left:0;top:0;width:676px}
.tap{position:absolute;width:90px;height:90px;border-radius:50%;border:5px solid var(--or);pointer-events:none}
.mail{position:absolute;inset:0;background:#0f1115;color:#e8eaed;padding:40px 30px;font-family:P}
.mail .bar{font-size:24px;color:#9aa0a6;margin-bottom:26px;display:flex;justify-content:space-between}
.mail .subj{font-size:34px;font-weight:600;line-height:1.25;margin-bottom:22px}
.mail .from{display:flex;gap:16px;align-items:center;margin-bottom:24px}
.mail .av{width:62px;height:62px;border-radius:50%;background:#0f766e;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:28px;color:#fff}
.mail .fn{font-size:26px;font-weight:600} .mail .fe{font-size:21px;color:#9aa0a6}
.mail .body{font-size:27px;line-height:1.5;white-space:pre-wrap;color:#e8eaed}
.mail .li{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid #2a2f3a}
.mail .li .av{flex:none}
.mail .ls{font-size:24px;font-weight:600;color:#e8eaed;margin-top:2px}
.mail .lp{font-size:21px;color:#9aa0a6;margin-top:4px;line-height:1.35}
.mail .tagdemo{position:absolute;left:30px;right:30px;bottom:30px;text-align:center;font-size:20px;color:#9aa0a6}
/* panel */
.panel{position:absolute;left:40px;right:40px;top:440px;max-height:950px;border-radius:26px;overflow:hidden;border:3px solid var(--line);background:#2a2a2a}
.panel img{display:block;width:100%}
.hl{position:absolute;border:5px solid var(--or);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
/* before/after */
.ba{position:absolute;left:60px;right:60px;border-radius:30px;padding:36px 40px;border:3px solid}
.ba .k{font-weight:800;font-size:30px;letter-spacing:3px}
.ba .t{font-weight:800;font-size:58px;line-height:1.1;margin-top:10px}
.ba .s{font-weight:500;font-size:32px;color:var(--mut);margin-top:12px;line-height:1.3}
.ba.b{top:420px;border-color:#5b2330;background:rgba(248,113,113,.08)} .ba.b .k{color:var(--red)}
.ba.a{top:880px;border-color:#1f5a3c;background:rgba(52,209,127,.09)} .ba.a .k{color:var(--gr)}
.card2{position:absolute;left:50px;right:50px;top:420px;background:#1b1f27;border:3px solid var(--line);border-radius:26px;padding:30px 32px}
.card2 .ttl{font-size:24px;font-weight:700;color:var(--mut);letter-spacing:1px;margin-bottom:18px}
.card2 .ln{font-family:'DejaVu Sans Mono',monospace;font-size:28px;line-height:1.45;color:#cbd5e1;margin:6px 0;padding:6px 12px;border-radius:10px}
.card2 .ln.mk{background:rgba(245,166,35,.16);color:#fff;border-left:6px solid var(--or)}
.spl-top{position:absolute;left:40px;right:40px;top:300px;height:520px;border-radius:28px;overflow:hidden;border:3px solid var(--line);background:#eef4f3}
.spl-top img{position:absolute;left:0;top:0;width:1000px}
.spl-bot{position:absolute;left:40px;right:40px;top:840px;height:540px;border-radius:28px;overflow:hidden;border:3px solid var(--line);background:#2a2a2a}
.spl-bot img{position:absolute;left:0;top:0;transform-origin:0 0}
.timer{position:absolute;right:60px;top:206px;font-family:'DejaVu Sans Mono',monospace;font-weight:700;font-size:54px;color:var(--gr);background:rgba(11,18,32,.9);border:3px solid var(--gr);border-radius:20px;padding:6px 18px}
.slabel{position:absolute;left:62px;z-index:5;font-weight:700;font-size:24px;color:#fff;background:rgba(11,18,32,.85);border-radius:14px;padding:6px 14px}
.stag{position:absolute;left:62px;right:62px;text-align:center;top:1500px;font-weight:700;font-size:30px;color:var(--or)}
body.bleed .win{left:0;right:0;top:0;height:1920px;border-radius:0;border:0}
body.bleed .head{top:190px;z-index:8;text-shadow:0 4px 24px rgba(0,0,0,.9)}
body.bleed .chip{top:1270px;left:60px}
body.bleed .simbar{top:1395px}
body.bleed #L_run:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(11,18,32,.92) 0,rgba(11,18,32,0) 22%,rgba(11,18,32,0) 62%,rgba(11,18,32,.95) 82%)}
/* cta */
.ctab{position:absolute;left:70px;right:70px;top:1000px;background:var(--or);color:#111;border-radius:34px;padding:34px 16px;text-align:center;font-weight:800;font-size:52px;white-space:nowrap}
.ctas{position:absolute;left:80px;right:80px;top:1190px;text-align:center;font-size:34px;font-weight:600;color:var(--mut)}
.ctah{position:absolute;left:60px;right:60px;top:430px;text-align:center;font-weight:800;font-size:84px;line-height:1.08;letter-spacing:-1px}
.ctah .or{color:var(--or)}
.mini{position:absolute;left:150px;right:150px;top:720px;border-radius:22px;overflow:hidden;border:3px solid var(--line);opacity:.95}
.mini img{width:100%;display:block}
</style></head>
<body>
<img id="bgimg">
<div class="glow"></div>
<div class="prog"><i id="pg"></i></div>
<div class="bug"><b>F</b>FrontDesk Flows</div>
<div class="real" id="realtag">REAL n8n RUN</div>

<div class="layer" id="L_hook">
  <div class="notif" id="notif"><div class="ic">H</div><div><div class="a" id="na"></div><div class="b" id="nb"></div></div></div>
  <div class="hk" id="hk"></div>
</div>

<div class="layer" id="L_form">
  <div class="head" id="fhead"></div>
  <div class="phone" id="fphone"><img id="fimg"><div class="tap" id="tap"></div></div>
</div>

<div class="layer" id="L_run">
  <div class="head" id="rhead"></div>
  <div class="win" id="win"><img class="src" id="nimg"><canvas id="cv" width="1000" height="980"></canvas></div>
  <div class="chip" id="chip"><div class="n" id="cn"></div><div><div class="t" id="ct"></div><div class="s" id="cs"></div></div></div>
  <div class="simbar" id="simbar"></div>
</div>

<div class="layer" id="L_panel">
  <div class="head" id="phead"></div>
  <div class="panel" id="panel"><img id="pimg"><div class="hl" id="phl"></div></div>
</div>

<div class="layer" id="L_split">
  <div class="head" id="shead" style="right:330px;text-align:left;font-size:52px"></div>
  <div class="timer" id="timer">0.00s</div>
  <div class="spl-top"><img id="simg"></div><div class="slabel" style="top:318px">Website / booking screen</div>
  <div class="spl-bot"><img id="snimg"></div><div class="slabel" style="top:858px">n8n · same moment</div>
  <div class="stag" id="stag"></div>
</div>

<div class="layer" id="L_card">
  <div class="head" id="khead"></div>
  <div class="card2" id="card2"></div>
</div>

<div class="layer" id="L_result">
  <div class="head" id="xhead"></div>
  <div class="phone" id="xphone" style="background:#0f1115"><div class="mail" id="mail"></div></div>
</div>

<div class="layer" id="L_ba">
  <div class="head" id="bhead">Before vs after</div>
  <div class="ba b" id="bab"><div class="k">BEFORE</div><div class="t" id="bbt"></div><div class="s" id="bbs"></div></div>
  <div class="ba a" id="baa"><div class="k">AFTER · WITH n8n</div><div class="t" id="bat"></div><div class="s" id="bas"></div></div>
</div>

<div class="layer" id="L_cta">
  <div class="ctah" id="ctah"></div>
  <div class="mini"><img id="miniimg"></div>
  <div class="ctab" id="ctab">DM “FLOW” for a free sample</div>
  <div class="ctas" id="ctas">@frontdeskflows</div>
</div>

<div class="sub" id="sub"></div>

<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eo=x=>1-Math.pow(1-clamp(x),3);
function pop(el,t,t0,d=.3,dist=40){const k=eo((t-t0)/d);el.style.opacity=k;el.style.transform=`translateY(${(1-k)*dist}px) scale(${.94+.06*k})`;}
function show(id){document.querySelectorAll('.layer').forEach(l=>l.style.display=l.id===id?'block':'none')}
function interp(keys,t){if(t<=keys[0][0])return keys[0].slice(1);for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const a=keys[i-1],b=keys[i],k=ease((t-a[0])/(b[0]-a[0]));return a.slice(1).map((v,j)=>v+(b[j+1]-v)*k)}}return keys[keys.length-1].slice(1)}
async function setImg(el,src){if(src&&el.getAttribute('src')!==src){el.src=src;await el.decode().catch(()=>{});}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

async function drawCanvas(sc,t,D){
    await setImg($('nimg'),D.nsrc);
    const win=$('win'); const W=win.clientWidth,H=win.clientHeight; const cvs=$('cv'); if(cvs.width!==W){cvs.width=W;cvs.height=H;} const [cx,cy,w]=interp(sc.cam,t); const s=W/w;
    $('nimg').style.transform=`scale(${s}) translate(${-(cx-w/2)}px,${-(cy-H/s/2)}px)`;
    // pulse overlay
    const g=$('cv').getContext('2d'); g.clearRect(0,0,W,H);
    const toV=([x,y])=>[(x-(cx-w/2))*s,(y-(cy-H/s/2))*s];
    for(const e of sc.edges){ // e: {p:[[x,y]..4 bezier], t0,t1}
      if(t<e.t0)continue; const k=clamp((t-e.t0)/(e.t1-e.t0));
      const P=e.p.map(toV); const bz=u=>{const a=1-u;return[a*a*a*P[0][0]+3*a*a*u*P[1][0]+3*a*u*u*P[2][0]+u*u*u*P[3][0],a*a*a*P[0][1]+3*a*a*u*P[1][1]+3*a*u*u*P[2][1]+u*u*u*P[3][1]]};
      g.save(); g.lineCap='round';
      g.strokeStyle='rgba(52,209,127,0.85)'; g.lineWidth=7*s; g.shadowColor='#34d17f'; g.shadowBlur=26;
      g.beginPath(); for(let u=0;u<=k;u+=.02){const p=bz(u); u===0?g.moveTo(...p):g.lineTo(...p);} g.stroke();
      if(k<1){const p=bz(k); g.fillStyle='#eafff3'; g.shadowBlur=40; g.beginPath(); g.arc(p[0],p[1],11*s,0,7); g.fill();}
      g.restore();
    }
    for(const n of sc.glow){ if(t<n.t)continue; const [x,y,w2,h2]=n.r; const [vx,vy]=toV([x,y]); const k=clamp((t-n.t)/.35);
      g.save(); g.strokeStyle=n.sim?'rgba(245,166,35,.95)':'rgba(52,209,127,.95)'; g.lineWidth=6*s; g.shadowColor=n.sim?'#f5a623':'#34d17f'; g.shadowBlur=30*(1.5-k);
      const pad=8*s; g.beginPath(); g.roundRect(vx-pad,vy-pad,w2*s+2*pad,h2*s+2*pad,16*s); g.stroke(); g.restore(); }
}
window.render=async function(T,D){
  const C=D.cfg, S=D.sched; document.body.classList.toggle('bleed', !!(C.layout==='bleed')); // sched: [{type,start,end,...}]
  $('pg').style.width=(100*T/D.total)+'%';
  await setImg($('bgimg'),D.bg);
  const sc=S.find(s=>T>=s.start&&T<s.end)||S[S.length-1]; const t=T-sc.start, dur=sc.end-sc.start;
  // subtitles
  const sb=$('sub'); const cue=(D.subs||[]).find(c=>T>=c.s&&T<c.e);
  sb.innerHTML=cue?cue.html:''; sb.style.opacity=cue?1:0;
  $('realtag').style.display = sc.type==='cta'?'none':'block';
  if(sc.type==='hook'){
    document.querySelectorAll('.layer').forEach(l=>l.style.display=(l.id==='L_hook'||l.id==='L_run')?'block':'none');
    $('rhead').style.display='none'; $('chip').style.display='none'; $('simbar').textContent='';
    await drawCanvas(sc,t,D); const h=sc;
    $('na').textContent=h.notifFrom||'Website enquiry · Harbourline Physio'; $('nb').textContent=h.notif||'';
    $('notif').style.display=h.notif?'flex':'none'; pop($('notif'),t,0,.25,-40);
    $('hk').innerHTML=h.lines.map((l,i)=>`<div class="l ${(h.color||[])[i]||''}" style="font-size:${h.lines.length>2?76:92}px">${esc(l)}</div>`).join('')+(h.badge?`<div class="badge">${esc(h.badge)}</div>`:'');
    [...$('hk').children].forEach((c,i)=>pop(c,t,.02+i*.18,.22,30));
  } else if(sc.type==='form'){
    show('L_form'); $('fhead').innerHTML=sc.head; pop($('fhead'),t,0,.25);
    await setImg($('fimg'),D.fsrc);
    const tp=$('tap'); const st=sc.tapAt; if(st!=null&&t>st&&t<st+.6){const k=(t-st)/.6;tp.style.display='block';tp.style.left=(sc.tapXY[0]-45)+'px';tp.style.top=(sc.tapXY[1]-45)+'px';tp.style.transform=`scale(${.6+k})`;tp.style.opacity=1-k;}else tp.style.display='none';
  } else if(sc.type==='run'){
    show('L_run'); $('rhead').style.display='block'; $('rhead').innerHTML=sc.head; pop($('rhead'),t,0,.25);
    await drawCanvas(sc,t,D);
    const st=sc.steps.filter(x=>t>=x.t).pop();
    const chip=$('chip'); if(st){chip.style.display='flex'; $('cn').textContent=st.i; $('ct').innerHTML=esc(st.title)+(st.sim?'<span class="sim">SIMULATED</span>':''); $('cs').textContent=st.sub||''; pop(chip,t,st.t,.22,-20);} else chip.style.display='none';
    $('simbar').textContent=sc.simNote||'';
  } else if(sc.type==='panel'){
    show('L_panel'); $('phead').innerHTML=sc.head; pop($('phead'),t,0,.25);
    await setImg($('pimg'),sc.img); const p=$('panel'); p.style.transform=`scale(${1+.03*t/dur})`; pop(p,t,.05,.3,30);
    const hl=$('phl'); if(sc.hl){hl.style.display='block';const[x,y,w2,h2]=sc.hl;hl.style.left=x+'px';hl.style.top=y+'px';hl.style.width=w2+'px';hl.style.height=h2+'px';hl.style.opacity=clamp((t-.5)/.3);}else hl.style.display='none';
  } else if(sc.type==='split'){
    show('L_split'); $('shead').innerHTML=sc.head; pop($('shead'),t,0,.25);
    await setImg($('simg'),D.fsrc); await setImg($('snimg'),D.nsrc);
    const [ty]=interp(sc.formScroll||[[0,0]],t); $('simg').style.transform=`translateY(${-ty}px)`;
    const [cx,cy,w]=sc.ncam; const s2=1000/w; $('snimg').style.transform=`scale(${s2}) translate(${-(cx-w/2)}px,${-(cy-540/s2/2)}px)`;
    const real=D.realT; $('timer').textContent=(real==null||real<0)?'0.00s':real.toFixed(2)+'s';
    const tg=(sc.tags||[]).filter(x=>real!=null&&real>=x.at).pop(); $('stag').textContent=tg?tg.text:'';
  } else if(sc.type==='card'){
    show('L_card'); $('khead').innerHTML=sc.head; pop($('khead'),t,0,.25);
    $('card2').innerHTML=`<div class="ttl">${esc(sc.title||'')}</div>`+sc.lines.map((l,i)=>`<div class="ln ${l.hl?'mk':''}" id="ln${i}">${esc(l.t)}</div>`).join('');
    pop($('card2'),t,.05,.3,30); sc.lines.forEach((l,i)=>{ if(l.hl){ const e=$('ln'+i); const k=clamp((t-(l.at??0.8))/.3); e.style.background=`rgba(245,166,35,${.16*k})`; e.style.borderLeftColor=`rgba(245,166,35,${k})`; } });
  } else if(sc.type==='result'){
    show('L_result'); $('xhead').innerHTML=sc.head; pop($('xhead'),t,0,.25);
    if(sc.list){ const L=sc.list; $('mail').innerHTML=`<div class="bar"><span>Inbox · ${L.length} new</span><span>${esc(sc.when||'6:00pm')}</span></div>`+L.map((m,i)=>`<div class="li" style="opacity:${clamp((t-.3-i*.45)/.25)};transform:translateX(${(1-eo((t-.3-i*.45)/.3))*60}px)"><div class="av">${esc(m.to[0].toUpperCase())}</div><div><div class="fn">${esc(m.to)}</div><div class="ls">${esc(m.subject)}</div><div class="lp">${esc(m.text.split('\n').filter(x=>x.trim())[1]||'')}</div></div></div>`).join('')+`<div class="tagdemo">${esc(sc.note||"Sent by n8n's Email node · demo inbox")}</div>`; pop($('xphone'),t,.05,.35,60); return true; }
    const m=sc.mail; $('mail').innerHTML=`<div class="bar"><span>Inbox</span><span>${esc(m.when||'now')}</span></div><div class="subj">${esc(m.subject)}</div><div class="from"><div class="av">${esc(m.av||'H')}</div><div><div class="fn">${esc(m.fromName)}</div><div class="fe">to ${esc(m.to)}</div></div></div><div class="body">${esc(m.text)}</div><div class="tagdemo">${esc(m.note||'Sent by n8n’s Email node · demo inbox')}</div>`;
    pop($('xphone'),t,.05,.35,60);
  } else if(sc.type==='ba'){
    show('L_ba'); $('bbt').textContent=sc.before[0]; $('bbs').textContent=sc.before[1]; $('bat').textContent=sc.after[0]; $('bas').textContent=sc.after[1];
    pop($('bhead'),t,0,.2); pop($('bab'),t,.1,.3); pop($('baa'),t,sc.afterAt??1.2,.3);
  } else if(sc.type==='cta'){
    show('L_cta'); $('ctah').innerHTML=sc.head; pop($('ctah'),t,0,.3); await setImg($('miniimg'),D.mini);
    const b=$('ctab'); pop(b,t,.4,.3); b.style.transform+=` scale(${1+.02*Math.sin(t*6)})`; $('ctas').textContent=sc.small||'@frontdeskflows';
  }
  return true;
}
</script>
</body></html>
