name: Make FrontDesk Flows audit
on:
  workflow_dispatch:
    inputs:
      action:
        description: "audit | run:<id> | activate:<id> | daily:<id>:<HH:MM>"
        default: audit
  schedule:
    - cron: "37 16 * * *"   # 21:37 PKT daily, after the evening post
permissions:
  contents: write
concurrency: make-fdf
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          MAKE_EU1_TOKEN: ${{ secrets.MAKE_EU1_TOKEN }}
          ACTION: ${{ github.event.inputs.action || 'audit' }}
        run: python3 scripts/make_fdf.py
      - run: |
          git config user.name "make-audit-bot"; git config user.email "actions@users.noreply.github.com"
          git add make-audit; git commit -qm "Make audit $(date -u +%FT%H%M)" || exit 0
          for n in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
