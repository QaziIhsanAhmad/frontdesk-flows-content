name: Post next Reel
on:
  schedule:
    - cron: "17 * * * *"   # hourly; posts only when an item is due, at most one Reel per 12 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = don't publish, just show what would be posted"
        default: "0"
permissions:
  contents: write
concurrency: post-reel
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due Reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'https://graph.instagram.com' }}
          MEDIA_BASE_URL: https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.sha }}/videos,https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/videos
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python3 scripts/post_next.py
      - name: Save queue status
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue.json
          git commit -m "Queue: post status $(date -u +%F)" || echo "no change"
          git push
